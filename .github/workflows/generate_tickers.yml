name: Generate Master Tickers

on:
  workflow_dispatch:

jobs:
  build-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas lxml html5lib requests

      - name: Scrape Global Indices
        run: |
          python -c "
          import pandas as pd
          import requests
          import re

          def get_tables(url):
              res = requests.get(url, headers={'User-Agent': 'Mozilla/5.0'})
              return pd.read_html(res.text)

          def find_ticker_column(df):
              for col in df.columns:
                  col_str = str(col).lower()
                  if 'ticker' in col_str or 'symbol' in col_str or 'code' in col_str:
                      return col
              return df.columns[0]

          def is_valid_ticker(t):
              t_str = str(t).strip()
              if not t_str or t_str.lower() in ['nan', 'none', 'website', 'type', 'constituents', 'trading symbol', 'weighting method', 'related indices']:
                  return False
              if t_str.isdigit():
                  return False
              if re.match(r'^(19|20)\d{2}', t_str):
                  return False
              if len(t_str) > 12:
                  return False
              return True

          tickers = set()

          # 1. US Markets (S&P 500 + Nasdaq 100)
          try:
              df = get_tables('https://en.wikipedia.org/wiki/List_of_S%26P_500_companies')[0]
              tickers.update([t for t in df[find_ticker_column(df)].dropna().tolist() if is_valid_ticker(t)])
          except Exception as e:
              print(f'S&P 500 error: {e}')

          try:
              df = get_tables('https://en.wikipedia.org/wiki/Nasdaq-100')[4]
              tickers.update([t for t in df[find_ticker_column(df)].dropna().tolist() if is_valid_ticker(t)])
          except Exception as e:
              print(f'Nasdaq error: {e}')

          # 2. Europe (STOXX Europe 600 - Scrape all constituent tables)
          try:
              print('Scraping STOXX Europe 600 components...')
              stoxx_tables = get_tables('https://en.wikipedia.org/wiki/STOXX_Europe_600')
              for df in stoxx_tables:
                  if len(df) > 10: # Target component tables
                      col = find_ticker_column(df)
                      for t in df[col].dropna().tolist():
                          if is_valid_ticker(t):
                              clean_t = str(t).strip().replace('.', '-')
                              tickers.add(clean_t)
          except Exception as e:
              print(f'STOXX error: {e}')

          # 3. Asia & Pacific (Nikkei, NIFTY, ASX)
          try:
              df = get_tables('https://en.wikipedia.org/wiki/Nikkei_225')[0]
              tickers.update([f'{str(t).strip()}.T' for t in df[find_ticker_column(df)].dropna().tolist() if is_valid_ticker(t)])
          except Exception as e:
              print(f'Nikkei error: {e}')

          try:
              df = get_tables('https://en.wikipedia.org/wiki/NIFTY_50')[2]
              tickers.update([f'{str(t).strip()}.NS' for t in df[find_ticker_column(df)].dropna().tolist() if is_valid_ticker(t)])
          except Exception as e:
              print(f'NIFTY error: {e}')

          try:
              df = get_tables('https://en.wikipedia.org/wiki/S%26P/ASX_200')[0]
              tickers.update([f'{str(t).strip()}.AX' for t in df[find_ticker_column(df)].dropna().tolist() if is_valid_ticker(t)])
          except Exception as e:
              print(f'ASX error: {e}')

          # 4. UK, Canada, Hong Kong, Switzerland, Brazil, South Africa
          try:
              df = get_tables('https://en.wikipedia.org/wiki/FTSE_100_Index')[4]
              tickers.update([f'{str(t).strip()}.L' for t in df[find_ticker_column(df)].dropna().tolist() if is_valid_ticker(t)])
          except Exception as e:
              print(f'FTSE error: {e}')

          try:
              df = get_tables('https://en.wikipedia.org/wiki/S%26P/TSX_60')[0]
              tickers.update([f'{str(t).strip()}.TO' for t in df[find_ticker_column(df)].dropna().tolist() if is_valid_ticker(t)])
          except Exception as e:
              print(f'TSX error: {e}')

          try:
              df = get_tables('https://en.wikipedia.org/wiki/Hang_Seng_Index')[4]
              tickers.update([f'{str(t).strip()}.HK' for t in df[find_ticker_column(df)].dropna().tolist() if is_valid_ticker(t)])
          except Exception as e:
              print(f'Hang Seng error: {e}')

          try:
              df = get_tables('https://en.wikipedia.org/wiki/Ibovespa')[1]
              tickers.update([f'{str(t).strip()}.SA' for t in df[find_ticker_column(df)].dropna().tolist() if is_valid_ticker(t)])
          except Exception as e:
              print(f'Ibovespa error: {e}')

          # 5. Strategic Middle East Injection
          uae_heavyweights = ['EMAAR.DU', 'ENBD.DU', 'DIB.DU', 'DEWA.DU', 'AIRARABIA.DU', 'ALDAR.AD', 'FAB.AD', 'TAQA.AD']
          tickers.update(uae_heavyweights)

          clean_tickers = sorted([str(t).replace('.', '-').upper().strip() for t in tickers if is_valid_ticker(t)])

          with open('master_tickers.txt', 'w') as f:
              f.write('\n'.join(clean_tickers))
          print(f'Successfully compiled {len(clean_tickers)} global entities.')
          "



      - name: Commit File to Repository
        run: |
          git config --global user.name "HOLO-EARTH Automation"
          git config --global user.email "automation@holoearth.system"
          git add master_tickers.txt
          git commit -m "Auto-generated master_tickers.txt with global indices"
          git push

          
