name: Generate Master Tickers

on:
  workflow_dispatch:

jobs:
  build-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas lxml html5lib requests

      - name: Scrape Global Indices
        run: |
          python -c "
          import pandas as pd
          import requests
          import re

          def get_tables(url):
              res = requests.get(url, headers={'User-Agent': 'Mozilla/5.0'})
              return pd.read_html(res.text)

          def find_ticker_column(df):
              for col in df.columns:
                  col_str = str(col).lower()
                  if 'ticker' in col_str or 'symbol' in col_str or 'code' in col_str:
                      return col
              return df.columns[0]

          def is_valid_ticker(t):
              t_str = str(t).strip()
              invalid_words = ['nan', 'none', 'website', 'type', 'constituents', 'trading symbol', 'weighting method', 'related indices']
              if not t_str or t_str.lower() in invalid_words:
                  return False
              if t_str.isdigit() or re.match(r'^(19|20)\d{2}', t_str):
                  return False
              if len(t_str) > 12:
                  return False
              return True

          tickers = set()

          # 1. US Markets (Replace dots with hyphens for share classes like BRK.B -> BRK-B)
          try:
              df = get_tables('https://en.wikipedia.org/wiki/List_of_S%26P_500_companies')[0]
              tickers.update([str(t).replace('.', '-').strip().upper() for t in df[find_ticker_column(df)].dropna().tolist() if is_valid_ticker(t)])
          except Exception as e:
              print(f'S&P 500 error: {e}')

          try:
              df = get_tables('https://en.wikipedia.org/wiki/Nasdaq-100')[4]
              tickers.update([str(t).replace('.', '-').strip().upper() for t in df[find_ticker_column(df)].dropna().tolist() if is_valid_ticker(t)])
          except Exception as e:
              print(f'Nasdaq error: {e}')

          # 2. International Markets (Strip Wikipedia artifacts, apply strict YF dot-suffixes)
          def clean_intl(t, suffix):
              base = str(t).split('.')[0].strip().upper()
              return f'{base}{suffix}'

          try:
              df = get_tables('https://en.wikipedia.org/wiki/Nikkei_225')[0]
              tickers.update([clean_intl(t, '.T') for t in df[find_ticker_column(df)].dropna().tolist() if is_valid_ticker(t)])
          except Exception: pass

          try:
              df = get_tables('https://en.wikipedia.org/wiki/NIFTY_50')[2]
              tickers.update([clean_intl(t, '.NS') for t in df[find_ticker_column(df)].dropna().tolist() if is_valid_ticker(t)])
          except Exception: pass

          try:
              df = get_tables('https://en.wikipedia.org/wiki/S%26P/ASX_200')[0]
              tickers.update([clean_intl(t, '.AX') for t in df[find_ticker_column(df)].dropna().tolist() if is_valid_ticker(t)])
          except Exception: pass

          try:
              df = get_tables('https://en.wikipedia.org/wiki/FTSE_100_Index')[4]
              tickers.update([clean_intl(t, '.L') for t in df[find_ticker_column(df)].dropna().tolist() if is_valid_ticker(t)])
          except Exception: pass

          try:
              df = get_tables('https://en.wikipedia.org/wiki/DAX')[4]
              tickers.update([clean_intl(t, '.DE') for t in df[find_ticker_column(df)].dropna().tolist() if is_valid_ticker(t)])
          except Exception: pass

          try:
              df = get_tables('https://en.wikipedia.org/wiki/CAC_40')[3]
              tickers.update([clean_intl(t, '.PA') for t in df[find_ticker_column(df)].dropna().tolist() if is_valid_ticker(t)])
          except Exception: pass

          try:
              df = get_tables('https://en.wikipedia.org/wiki/S%26P/TSX_60')[0]
              tickers.update([clean_intl(t, '.TO') for t in df[find_ticker_column(df)].dropna().tolist() if is_valid_ticker(t)])
          except Exception: pass
          
          try:
              df = get_tables('https://en.wikipedia.org/wiki/Hang_Seng_Index')[4]
              tickers.update([clean_intl(t, '.HK') for t in df[find_ticker_column(df)].dropna().tolist() if is_valid_ticker(t)])
          except Exception: pass
          
          try:
              df = get_tables('https://en.wikipedia.org/wiki/Ibovespa')[1]
              tickers.update([clean_intl(t, '.SA') for t in df[find_ticker_column(df)].dropna().tolist() if is_valid_ticker(t)])
          except Exception: pass

          # 3. Middle East Logistics/Finance
          uae_heavyweights = ['EMAAR.DU', 'ENBD.DU', 'DIB.DU', 'DEWA.DU', 'AIRARABIA.DU', 'ALDAR.AD', 'FAB.AD', 'TAQA.AD']
          tickers.update(uae_heavyweights)

          # Final sorting (NO global replacements here)
          clean_tickers = sorted(list(tickers))

          with open('master_tickers.txt', 'w') as f:
              f.write('\n'.join(clean_tickers))
          print(f'Successfully compiled {len(clean_tickers)} mapped global entities.')
          "



      - name: Commit File to Repository
        run: |
          git config --global user.name "HOLO-EARTH Automation"
          git config --global user.email "automation@holoearth.system"
          git add master_tickers.txt
          git commit -m "Auto-generated master_tickers.txt with global indices"
          git push

          
