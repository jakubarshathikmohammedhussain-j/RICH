name: Generate Master Tickers

on:
  workflow_dispatch:

jobs:
  build-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas lxml html5lib requests

      - name: Scrape Global Indices (2500+ Entities)
        run: |
          python -c "
          import pandas as pd
          import requests
          import re

          def get_tables(url):
              res = requests.get(url, headers={'User-Agent': 'Mozilla/5.0'})
              return pd.read_html(res.text)

          def find_ticker_column(df):
              for col in df.columns:
                  col_str = str(col).lower()
                  if 'ticker' in col_str or 'symbol' in col_str or 'code' in col_str:
                      return col
              return df.columns[0]

          def is_valid_ticker(t):
              t_str = str(t).strip()
              invalid_words = ['nan', 'none', 'website', 'type', 'constituents', 'trading symbol']
              if not t_str or t_str.lower() in invalid_words: return False
              if t_str.isdigit() or re.match(r'^(19|20)\d{2}', t_str): return False
              if len(t_str) > 10: return False
              return True

          tickers = set()

          # Helper for US Markets (replaces dot with hyphen for share classes)
          def add_us(url):
              try:
                  tables = get_tables(url)
                  for df in tables:
                      if len(df) > 50:
                          col = find_ticker_column(df)
                          for t in df[col].dropna().tolist():
                              if is_valid_ticker(t):
                                  tickers.add(str(t).replace('.', '-').strip().upper())
              except Exception as e: print(f'US Scrape error: {e}')

          # Helper for Intl Markets (strips dots, adds strict YF suffix)
          def add_intl(url, suffix):
              try:
                  tables = get_tables(url)
                  for df in tables:
                      if len(df) > 30:
                          col = find_ticker_column(df)
                          for t in df[col].dropna().tolist():
                              if is_valid_ticker(t):
                                  base = str(t).split('.')[0].strip().upper()
                                  tickers.add(f'{base}{suffix}')
              except Exception as e: print(f'Intl Scrape error: {e}')

          # 1. US Markets (S&P 1500 + Nasdaq 100) -> ~1,600 targets
          add_us('https://en.wikipedia.org/wiki/List_of_S%26P_500_companies')
          add_us('https://en.wikipedia.org/wiki/List_of_S%26P_400_companies')
          add_us('https://en.wikipedia.org/wiki/List_of_S%26P_600_companies')
          add_us('https://en.wikipedia.org/wiki/Nasdaq-100')

          # 2. International Markets -> ~1,000+ targets
          add_intl('https://en.wikipedia.org/wiki/FTSE_100_Index', '.L')
          add_intl('https://en.wikipedia.org/wiki/FTSE_250_Index', '.L')
          add_intl('https://en.wikipedia.org/wiki/S%26P/TSX_Composite_Index', '.TO')
          add_intl('https://en.wikipedia.org/wiki/Nikkei_225', '.T')
          add_intl('https://en.wikipedia.org/wiki/S%26P/ASX_200', '.AX')
          add_intl('https://en.wikipedia.org/wiki/NIFTY_50', '.NS')
          add_intl('https://en.wikipedia.org/wiki/DAX', '.DE')
          add_intl('https://en.wikipedia.org/wiki/CAC_40', '.PA')

          # 3. Middle East Strategic Injection
          tickers.update(['EMAAR.DU', 'ENBD.DU', 'DIB.DU', 'DEWA.DU', 'AIRARABIA.DU', 'ALDAR.AD', 'FAB.AD', 'TAQA.AD'])

          clean_tickers = sorted(list(tickers))
          with open('master_tickers.txt', 'w') as f:
              f.write('\n'.join(clean_tickers))
          print(f'Successfully compiled {len(clean_tickers)} mapped global entities.')
          "
          


      - name: Commit File to Repository
        run: |
          git config --global user.name "HOLO-EARTH Automation"
          git config --global user.email "automation@holoearth.system"
          git add master_tickers.txt
          git commit -m "Auto-generated master_tickers.txt with global indices"
          git push

          
