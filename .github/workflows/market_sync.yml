name: RICH Execution Node

on:
  schedule:
    # 22:00 UTC corresponds to 3:30 AM IST (Tuesday-Saturday morning), capturing fully settled US market closes
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

jobs:
  execute-rich-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Daily Tracker & Trigger Email
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python rich_sync.py
        
